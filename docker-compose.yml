services:
  mysql:
    image: mysql:8.4
    container_name: banking-mysql
    environment:
      MYSQL_DATABASE: banking
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - banking-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  banking-mysql-data:
